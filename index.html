<script>
document.addEventListener('DOMContentLoaded',()=>{
 const launcher=document.createElement('button');launcher.className='ai-launch';launcher.innerHTML='<span style="font-size:20px">✦</span> Asisten AI';launcher.setAttribute('aria-label','Buka Asisten AI HRFlow');
 const panel=document.createElement('section');panel.className='ai-panel';panel.setAttribute('aria-label','Asisten AI HRFlow');panel.innerHTML='<div class="ai-head"><div><strong>✦ Asisten HRFlow</strong><small>Teman urusan cuti & lembur · Demo</small></div><button class="ai-close" aria-label="Tutup asisten">✕</button></div><div class="ai-messages" aria-live="polite"><div class="ai-msg">Halo! 👋 Aku asisten HRFlow. Aku bisa bantu menjelaskan pengajuan cuti, lembur, status, dan cara menggunakan portal ini. Mau tanya apa?</div></div><div class="ai-quick"><button data-q="Bagaimana cara mengajukan cuti?">Ajukan cuti</button><button data-q="Bagaimana cara mengajukan lembur?">Ajukan lembur</button><button data-q="Apa arti status pengajuan?">Arti status</button><button data-q="Bagaimana cara tanda tangan digital?">Tanda tangan</button></div><div class="ai-disclaimer">Asisten demo berbasis panduan. Tidak terhubung ke data HR atau AI eksternal.</div><form class="ai-compose"><input aria-label="Pesan untuk asisten" placeholder="Tulis pertanyaanmu…" autocomplete="off"><button type="submit">Kirim</button></form>';
 document.body.append(launcher,panel);launcher.addEventListener('click',()=>{panel.classList.toggle('open');if(panel.classList.contains('open'))panel.querySelector('input').focus()});panel.querySelector('.ai-close').addEventListener('click',()=>panel.classList.remove('open'));
 const messages=panel.querySelector('.ai-messages');function reply(q){const user=document.createElement('div');user.className='ai-msg user';user.textContent=q;messages.append(user);const a=document.createElement('div');a.className='ai-msg';const t=q.toLowerCase();if(t.includes('cuti'))a.textContent='Untuk mengajukan cuti:\n1. Buka menu Ajukan Cuti.\n2. Periksa data diri dan pilih jenis cuti.\n3. Tentukan tanggal mulai dan selesai, lalu isi alasan.\n4. Unggah bukti jika diperlukan dan bubuhkan tanda tangan digital.\n5. Tinjau kembali lalu kirim. Pantau hasilnya di menu Status.';else if(t.includes('lembur'))a.textContent='Untuk mengajukan lembur, buka Ajukan Lembur, pilih tanggal serta jam mulai dan selesai, isi deskripsi pekerjaan, lampirkan bukti bila diperlukan, lalu tanda tangani dan kirim. Pastikan durasi yang dihitung sudah benar.';else if(t.includes('status'))a.textContent='Diajukan berarti formulir sudah dikirim; Diproses berarti sedang ditinjau; Disetujui berarti pengajuan diterima; Ditolak berarti pengajuan belum disetujui. Buka menu Status untuk melihat riwayat. Untuk alasan penolakan, hubungi HRD.';else if(t.includes('tanda tangan')||t.includes('tandatangan'))a.textContent='Goreskan tanda tangan pada area tanda tangan di formulir. Jika belum cocok, gunakan tombol Hapus/Ulangi sebelum mengirim. Periksa juga cap waktu dan pastikan tanda tangan sudah terlihat.';else if(t.includes('kalender')||t.includes('jadwal'))a.textContent='Buka Kalender Tim untuk melihat jadwal cuti dan lembur yang tersedia pada data demo. Jika ada potensi bentrok, koordinasikan dengan atasan atau HRD sebelum mengirim pengajuan.';else if(t.includes('bukti')||t.includes('foto')||t.includes('upload'))a.textContent='Pilih berkas foto pada bagian Upload Bukti. Periksa pratinjau dan pesan validasi ukuran/format yang tampil di formulir. Kebutuhan bukti dapat berbeda menurut jenis pengajuan; ikuti kebijakan HRD perusahaan.';else if(t.includes('halo')||t.includes('hai'))a.textContent='Hai! Senang bisa membantu. Kamu bisa bertanya tentang pengajuan cuti, lembur, tanda tangan, status, atau kalender tim.';else a.textContent='Aku bisa membantu panduan penggunaan HRFlow. Coba tanyakan “Bagaimana cara mengajukan cuti?”, “Bagaimana cara mengajukan lembur?”, “Apa arti status pengajuan?”, atau “Bagaimana cara tanda tangan digital?”. Untuk keputusan kebijakan resmi, silakan konfirmasi ke HRD.';messages.append(a);messages.scrollTop=messages.scrollHeight;};
 panel.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>reply(b.dataset.q)));panel.querySelector('form').addEventListener('submit',e=>{e.preventDefault();const input=panel.querySelector('input');const q=input.value.trim();if(q){input.value='';reply(q)}});
});

function wireForm(){const start=document.getElementById('startDate'),end=document.getElementById('endDate');function days(){if(!start||!end||!start.value||!end.value)return;let a=new Date(start.value+'T12:00:00'),b=new Date(end.value+'T12:00:00');if(b<a){document.getElementById('totalDays').value='Tanggal selesai sebelum tanggal mulai';return}let n=0;for(let d=new Date(a);d<=b;d.setDate(d.getDate()+1)){if(d.getDay()!==0&&d.getDay()!==6)n++}document.getElementById('totalDays').value=n+' hari kerja (estimasi)'}if(start){start.addEventListener('change',days);end.addEventListener('change',days)}const st=document.getElementById('startTime'),et=document.getElementById('endTime');function hours(){if(!st||!et)return;let [sh,sm]=st.value.split(':').map(Number),[eh,em]=et.value.split(':').map(Number);let m=eh*60+em-(sh*60+sm);if(m<0)m+=1440;document.getElementById('totalHours').value=Math.floor(m/60)+' jam '+m%60+' menit'}if(st){st.addEventListener('change',hours);et.addEventListener('change',hours)}restoreDraft();days();hours();document.getElementById('backBtn').onclick=()=>{collect();if(step>0){step--;render()}};document.getElementById('nextBtn').onclick=()=>{if(step<4){let required=document.querySelectorAll('#requestForm [required]');for(let x of required){if(!x.value){x.reportValidity();return}}if(formType==='cuti'&&step===2&&document.getElementById('endDate').value<document.getElementById('startDate').value){toast('Tanggal selesai tidak boleh sebelum tanggal mulai.');return}collect();step++;render();if(step===4)wireSignature();return}submitRequest()}}
function wireSignature(){const c=document.getElementById('signature');if(!c)return;let ctx=c.getContext('2d'),drawing=false,has=false;function resize(){let r=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;let old=has?c.toDataURL():null;c.width=r.width*dpr;c.height=150*dpr;ctx.scale(dpr,dpr);ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#12263f';if(old){let img=new Image();img.onload=()=>ctx.drawImage(img,0,0,r.width,150);img.src=old}}resize();function pos(e){let r=c.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}c.onpointerdown=e=>{drawing=true;has=true;c.setPointerCapture(e.pointerId);let [x,y]=pos(e);ctx.beginPath();ctx.moveTo(x,y)};c.onpointermove=e=>{if(!drawing)return;let [x,y]=pos(e);ctx.lineTo(x,y);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false;document.getElementById('clearSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);has=false};document.getElementById('redoSig').onclick=()=>{ctx.clearRect(0,0,c.width,c.height);has=false;toast('Silakan tanda tangan ulang.')};let proof=document.getElementById('proof');proof.onchange=()=>{let f=proof.files[0],out=document.getElementById('previewProof');if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>5*1024*1024){proof.value='';out.innerHTML='<span class="tag red">File tidak valid atau lebih dari 5 MB.</span>';return}let u=URL.createObjectURL(f);out.innerHTML=`<img src="${u}" alt="Pratinjau bukti" style="margin-top:10px;max-width:180px;max-height:140px;border:2px solid #000;border-radius:7px;object-fit:cover"><div class="hint">${f.name} · ${(f.size/1024/1024).toFixed(2)} MB</div>`}}

utusan akhir.</p></details><details><summary>Apakah data saya sudah tersimpan ke HRD?</summary><p>Belum. Ini adalah preview interaktif yang menggunakan data simulasi di browser. Integrasi backend dan penyimpanan aman diperlukan sebelum penggunaan resmi.</p></details></div></section>`}

 empUnsubs.forEach(f=>f());empUnsubs=[];if(!cloud.uid)return;

function attachHr(){
 hrUnsubs.forEach(f=>f());hrUnsubs=[];const db=cloud.hrDb;let first=true;const er=err=>{console.error(err);toast('Gagal memuat data: '+(err.code||err.message))};
 hrUnsubs.push(db.collection('requests').onSnapshot(s=>{
  if(!first)s.docChanges().forEach(c=>{if(c.type==='added'&&!c.doc.metadata.hasPendingWrites)toast('Pengajuan baru dari '+c.doc.data().nama)});
  first=false;requests=s.docs.map(d=>d.data()).sort((a,b)=>b.at.localeCompare(a.at));refreshHr()},er));

function sigDrawn(){const c=document.getElementById('signature');if(!c)return false;const d=c.getContext('2d').getImageData(0,0,c.width,c.height).data;for(let i=3;i<d.length;i+=4){if(d[i])return true}return false}

 if(!sigDrawn()){toast('Mohon bubuhkan tanda tangan digital terlebih dahulu.');return}
 collect();const d=draft,cuti=formType==='cuti',now=new Date(),pf=document.getElementById('proof');
 const hm=(d.totalHours||'').match(/(\d+)\s*jam\s*(\d+)/);
 const r={id:'HF-'+String(Date.now()).slice(-5)+Math.floor(Math.random()*10),nik:demoUser.nik,nama:demoUser.nama,divisi:demoUser.divisi,kind:formType,
  type:cuti?(d.leaveType||'Cuti Tahunan'):'Lembur',sub:cuti?'':(d.otType||''),
  date:cuti?dmy(d.startDate)+' – '+dmy(d.endDate):dmy(d.otDate)+' · '+(d.startTime||'').replace(':','.')+'–'+(d.endTime||'').replace(':','.'),

  status:'Diajukan',reason:d.reason||'-',note:'',proof:!!(pf&&pf.files&&pf.files[0]),proofName:(pf&&pf.files&&pf.files[0])?pf.files[0].name:'',
  sig:document.getElementById('signature').toDataURL('image/png'),days:cuti?(parseInt(d.totalDays)||0):0,hours:(!cuti&&hm)?(+hm[1]+(+hm[2])/60):0};
 if(CLOUD){if(!cloud.uid){toast('Belum terhubung ke server. Coba lagi sebentar.');return}r.ownerUid=cloud.uid;
  cloud.db.collection('requests').doc(r.id).set(r).catch(err=>toast('Gagal mengirim: '+(err.code||err.message)))}

/* Password TIDAK disimpan sebagai teks. Hanya hash PBKDF2-SHA256 (210.000 iterasi + salt). */
const HR_SALT='gos-hrflow-0001a205be0faaa1',HR_ITER=210000,HR_HASH='563a980eb22754acc929f7ae1dca59a32efad72b91986533e3fdab4f5ea09fc1';
const LOCK_KEY='hrflow_lock_v1';
let hrTimer=null;
function getLock(){try{return JSON.parse(localStorage.getItem(LOCK_KEY))||{fails:0,until:0}}catch(e){return{fails:0,until:0}}}
function setLock(o){try{localStorage.setItem(LOCK_KEY,JSON.stringify(o))}catch(e){}}
async function pbkdf2(pw){const enc=new TextEncoder();const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(HR_SALT),iterations:HR_ITER,hash:'SHA-256'},key,256);
 return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function safeEq(a,b){if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a.charCodeAt(i)^b.charCodeAt(i);return d===0}
function hrArm(){clearTimeout(hrTimer);if(!hrLogged)return;hrTimer=setTimeout(()=>hrLogout(true),15*60*1000)}
['pointerdown','keydown','scroll'].forEach(ev=>window.addEventListener(ev,()=>{if(hrLogged)hrArm()},{passive:true}));
function hrLogout(auto){if(!hrLogged)return;clearTimeout(hrTimer);if(auto){logHr('Sesi berakhir otomatis (tidak aktif 15 menit)');hrLogged=false;hrName='';hrDetach()}go('beranda');toast(auto?'Sesi Ruang Kendali berakhir karena tidak aktif.':'Kamu sudah keluar dari Ruang Kendali.')}
async function hrLogin(){
 const who=(document.getElementById('nik').value||'').trim().slice(0,40)||'HRD';
 const pw=document.getElementById('password').value;const btn=document.querySelector('#loginForm button[type=submit]');
 let lk=getLock();const now=Date.now();
 if(lk.until>now){toast('Terlalu banyak percobaan. Coba lagi dalam '+Math.ceil((lk.until-now)/60000)+' menit.');return}
 btn.disabled=true;let ok=false,cfgErr='';
 if(CLOUD){
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(who)){btn.disabled=false;toast('Isi kolom ID dengan EMAIL HRD (contoh: nama@gmail.com).');return}
  if(location.protocol==='file:'){btn.disabled=false;toast('Login cloud tidak jalan jika file dibuka langsung. Buka lewat https:// (hosting) atau http://localhost.');return}
  try{await cloud.hrAuth.setPersistence(firebase.auth.Auth.Persistence.SESSION)}catch(e){}
  try{const cred=await cloud.hrAuth.signInWithEmailAndPassword(who.toLowerCase(),pw);ok=HR_EMAILS.includes((cred.user.email||'').toLowerCase());if(!ok){await cloud.hrAuth.signOut();cfgErr='Akun ini bukan akun HRD: email belum ada di daftar HR_EMAILS pada kode.'}}
  catch(e){const c=(e&&e.code)||'';console.error('HR login',e);
   if(c==='auth/operation-not-allowed')cfgErr='Metode Email/Password belum diaktifkan di Firebase Authentication.';
   else if(c==='auth/network-request-failed')cfgErr='Tidak bisa terhubung ke Firebase. Periksa koneksi internet.';
   else if(c==='auth/unauthorized-domain'||c==='auth/operation-not-supported-in-this-environment')cfgErr='Domain ini belum diizinkan. Tambahkan di Firebase Authentication > Settings > Authorized domains.';
   else if(c==='auth/too-many-requests')cfgErr='Terlalu banyak percobaan. Coba lagi beberapa menit lagi.';
   else if(c==='auth/api-key-not-valid.-please-pass-a-valid-api-key.'||c==='auth/invalid-api-key')cfgErr='API key Firebase pada FIREBASE_CONFIG tidak valid.';
   else if(!['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email','auth/invalid-login-credentials'].includes(c))cfgErr='Login gagal ('+c+').'}}
 else{if(!(window.crypto&&crypto.subtle)){btn.disabled=false;toast('Browser tidak mendukung verifikasi aman. Buka website lewat https.');return}try{ok=safeEq(await pbkdf2(pw),HR_HASH)&&HR_EMAILS.includes(who.toLowerCase())}catch(e){}}
 btn.disabled=false;
 if(cfgErr){toast(cfgErr);return}
 if(ok){setLock({fails:0,until:0});hrLogged=true;hrName=who;hrTab='antrean';hrFilter='Semua';if(CLOUD)attachHr();logHr('Login berhasil',who);hrArm();renderHrDashboard();toast('Selamat datang di Ruang Kendali.');return}
 lk.fails=(lk.fails||0)+1;let msg='Password salah.';
 if(lk.fails>=5){lk={fails:0,until:now+5*60*1000};msg='Password salah 5 kali. Ruang Kendali terkunci 5 menit.'}else{msg+=' Sisa percobaan: '+(5-lk.fails)+'.'}
 setLock(lk);logHr('Percobaan login gagal'+(lk.until?' (akun terkunci 5 menit)':' (ke-'+lk.fails+')'),who);
 const p=document.querySelector('.login-layout');if(p){p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake')}
 document.getElementById('password').value='';toast(msg);
}

function conflict(r){if(r.kind!=='cuti'||!r.from||!['Diajukan','Diproses','Perlu Revisi'].includes(r.status))return false;
 return requests.some(o=>o.id!==r.id&&o.kind==='cuti'&&o.divisi===r.divisi&&o.status!=='Ditolak'&&o.from&&o.from<=r.to&&o.to>=r.from)}
function antreanTab(){
 const pend=r=>r.status==='Diajukan'||r.status==='Diproses';
 const list=requests.filter(r=>hrFilter==='Semua'||(hrFilter==='Menunggu'?pend(r):r.status===hrFilter)).slice().sort((a,b)=>b.at.localeCompare(a.at));
 const opts=['Semua','Menunggu','Perlu Revisi','Disetujui','Ditolak'];
 return `<div class="stats four"><div class="stat"><strong>${requests.length}</strong><span>Semua pengajuan</span></div><div class="stat"><strong>${requests.filter(pend).length}</strong><span>Menunggu tinjauan</span></div><div class="stat"><strong>${requests.filter(r=>r.status==='Perlu Revisi').length}</strong><span>Perlu revisi</span></div><div class="stat"><strong>${requests.filter(r=>r.status==='Disetujui').length}</strong><span>Disetujui</span></div></div>
 <div class="panel"><h3>Antrean persetujuan</h3><div class="toolbar"><label for="flt"><b>Tampilkan:</b></label><select id="flt" onchange="hrFilter=this.value;renderHrDashboard()">${opts.map(o=>`<option ${o===hrFilter?'selected':''}>${o}</option>`).join('')}</select><span class="hint">Pengajuan yang sudah Disetujui/Ditolak terkunci dan tidak bisa diubah (integritas data).</span></div>
 <div class="table-wrap"><table><thead><tr><th>ID</th><th>Karyawan</th><th>Jenis</th><th>Tanggal / Jam</th><th>Dikirim</th><th>Status</th><th>Aksi</th></tr></thead><tbody>${list.length?list.map(r=>{const fin=r.status==='Disetujui'||r.status==='Ditolak';
 return `<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.nama)}<br><span class="hint">${esc(r.divisi)} · ${esc(r.nik)}</span></td><td>${esc(r.type)}${conflict(r)?'<br><span class="tag red">⚠ Bentrok divisi</span>':''}</td><td>${esc(r.date)}</td><td>${tglS(r.at)}<br><span class="hint">${jamS(r.at)}</span></td><td>${statTag(r.status)}</td><td><div class="row-actions"><button class="btn soft sm" onclick="showDetail('${r.id}')">Detail</button>${fin?'<span class="tag">🔒 Final</span>':`<button class="btn teal sm" onclick="hrDecide('${r.id}','Disetujui')">Setujui</button><button class="btn warn sm" onclick="hrDecide('${r.id}','Perlu Revisi')">Revisi</button><button class="btn danger sm" onclick="hrDecide('${r.id}','Ditolak')">Tolak</button>`}</div></td></tr>`}).join(''):'<tr><td colspan="7" class="empty">Tidak ada pengajuan pada filter ini.</td></tr>'}</tbody></table></div></div>`}
function hrDecide(id,status){
 const r=requests.find(x=>x.id===id);if(!r||r.status==='Disetujui'||r.status==='Ditolak')return;
 const e=employees.find(x=>x.nik===r.nik);const potong=status==='Disetujui'&&r.kind==='cuti'&&r.type==='Cuti Tahunan'&&r.days>0;
 if(potong&&e&&r.days>e.sisa&&!confirm('Sisa cuti '+r.nama+' hanya '+e.sisa+' hari, sedangkan pengajuan '+r.days+' hari. Tetap setujui?'))return;
 let note=r.note||'';
 if(status!=='Disetujui'){const n=prompt(status==='Ditolak'?'Alasan penolakan (akan terlihat oleh karyawan):':'Catatan revisi untuk karyawan:',note);if(n===null)return;note=n.trim()}
 else if(!confirm('Setujui pengajuan '+r.id+' atas nama '+r.nama+'? Setelah disetujui, data terkunci.'))return;
 const upd={status,note,decidedAt:new Date().toISOString(),decidedBy:hrName};
 const log='Keputusan '+status+' · '+r.id+' ('+r.nama+', '+r.type+')';
 if(CLOUD){cloud.hrDb.collection('requests').doc(r.id).update(upd).then(()=>{if(potong&&e){e.sisa=Math.max(0,e.sisa-r.days);empWrite(e)}logHr(log);toast('Status '+r.id+': '+status)}).catch(err=>toast('Gagal menyimpan: '+(err.code||err.message)));return}
 Object.assign(r,upd);if(potong&&e)e.sisa=Math.max(0,e.sisa-r.days);logHr(log);saveData();renderHrDashboard();toast('Status '+r.id+': '+status);
}

 document.body.appendChild(bg);bg.querySelector('#closeModal').onclick=()=>bg.remove();

function aktivitasTab(){
 const rows=activity.slice(0,150);
 return `<div class="panel"><h3>Log aktivitas karyawan</h3><div class="toolbar"><input id="actQ" placeholder="Cari nama / divisi / aktivitas…" aria-label="Cari log" oninput="filterRows(this.value,'actTable')" style="min-width:240px"><span class="hint">Menampilkan ${rows.length} aktivitas terbaru. Cap waktu dicatat otomatis.</span></div><div class="table-wrap"><table id="actTable"><thead><tr><th>Tanggal</th><th>Jam</th><th>Karyawan</th><th>Divisi</th><th>Aktivitas</th></tr></thead><tbody>${rows.map(a=>`<tr><td>${tglS(a.t)}</td><td>${jamS(a.t)}</td><td>${esc(a.nama)}<br><span class="hint">${esc(a.nik)}</span></td><td>${esc(a.divisi)}</td><td>${esc(a.aksi)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada aktivitas.</td></tr>'}</tbody></table></div></div>`}
function filterRows(q,id){q=q.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(tr=>{tr.style.display=tr.textContent.toLowerCase().includes(q)?'':'none'})}
function monthList(){const s=new Set(requests.map(r=>mKey(r.at)));s.add(mKey(new Date().toISOString()));return [...s].sort().reverse()}
function monthRows(){return requests.filter(r=>mKey(r.at)===hrMonth).slice().sort((a,b)=>a.at.localeCompare(b.at))}
function rekapTab(){
 const ml=monthList();if(!ml.includes(hrMonth))hrMonth=ml[0];const rows=monthRows();
 const cuti=rows.filter(r=>r.kind==='cuti'),lem=rows.filter(r=>r.kind==='lembur');
 const jam=lem.filter(r=>r.status==='Disetujui').reduce((s,r)=>s+(r.hours||0),0);
 return `<div class="stats four"><div class="stat"><strong>${cuti.length}</strong><span>Pengajuan cuti / izin</span></div><div class="stat"><strong>${lem.length}</strong><span>Pengajuan lembur</span></div><div class="stat"><strong>${rows.filter(r=>r.status==='Disetujui').length}</strong><span>Disetujui</span></div><div class="stat"><strong>${Math.round(jam*10)/10} jam</strong><span>Lembur disetujui</span></div></div>
 <div class="panel"><h3>Rekap bulanan · ${mLabel(hrMonth)}</h3><div class="toolbar"><label for="mSel"><b>Bulan:</b></label><select id="mSel" onchange="hrMonth=this.value;renderHrDashboard()">${ml.map(k=>`<option value="${k}" ${k===hrMonth?'selected':''}>${mLabel(k)}</option>`).join('')}</select><button class="btn teal sm" onclick="dlCsv()">⬇ Unduh Excel (CSV)</button><button class="btn primary sm" onclick="dlPdf()">⬇ Unduh PDF</button></div>
 <p class="hint">Dikelompokkan berdasarkan tanggal pengisian. Tombol PDF membuka jendela cetak; pilih “Simpan sebagai PDF”. Laporan PDF memuat kode verifikasi.</p>
 <div class="table-wrap"><table><thead><tr><th>Tgl isi</th><th>Karyawan</th><th>Jenis</th><th>Tanggal / Jam</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${tglS(r.at)}</td><td>${esc(r.nama)}<br><span class="hint">${esc(r.divisi)}</span></td><td>${esc(r.type)}</td><td>${esc(r.date)}</td><td>${esc(totalStr(r))}</td><td>${statTag(r.status)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Belum ada data pada bulan ini.</td></tr>'}</tbody></table></div></div>`}
function dlCsv(){
 const rows=monthRows();const q=v=>{let s=String(v==null?'':v);if(/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'};
 const head=['ID','NIK','Nama','Divisi','Jenis','Tanggal/Jam','Total','Status','Tanggal Isi','Jam Isi','Alasan','Catatan HRD'];
 const lines=[head.map(q).join(';')].concat(rows.map(r=>[r.id,r.nik,r.nama,r.divisi,r.type,r.date,totalStr(r),r.status,tglS(r.at),jamS(r.at),r.reason,r.note].map(q).join(';')));
 const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='HRFlow-Laporan-'+hrMonth+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
 logHr('Mengunduh laporan CSV '+mLabel(hrMonth));toast('Laporan CSV diunduh. Buka dengan Excel atau Google Sheets.');
}
async function dlPdf(){
 const rows=monthRows(),stamp=new Date();let code='-';
 try{const base=rows.map(r=>[r.id,r.nik,r.status,r.date].join('|')).join('\n')+'|'+hrMonth+'|'+hrName+'|'+stamp.toISOString();
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(base));code=[...new Uint8Array(buf)].slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase().match(/.{4}/g).join('-')}catch(e){}
 let pa=document.getElementById('printArea');if(!pa){pa=document.createElement('div');pa.id='printArea';document.body.appendChild(pa)}
 pa.innerHTML=`<h1>Laporan Bulanan Cuti & Lembur</h1><p><b>PT Global Office Solution</b> · HRD (Kepegawaian) · HRFlow</p><p>Periode: <b>${mLabel(hrMonth)}</b> · Total pengajuan: <b>${rows.length}</b></p><table><thead><tr><th>No</th><th>Karyawan</th><th>Jenis</th><th>Tanggal / Jam</th><th>Total</th><th>Status</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nama)} (${esc(r.divisi)})</td><td>${esc(r.type)}</td><td>${esc(r.date)}</td><td>${esc(totalStr(r))}</td><td>${esc(r.status)}</td></tr>`).join('')}</tbody></table><p style="margin-top:28px">Disahkan oleh: <b>${esc(hrName)}</b> (HRD)<br>Dicetak: ${tglS(stamp.toISOString())} ${jamS(stamp.toISOString())}<br>Kode verifikasi: <b>${code}</b></p>`;
 logHr('Mengunduh laporan PDF '+mLabel(hrMonth)+' (kode '+code+')');setTimeout(()=>window.print(),200);
}
function bars(items,cls){const mx=Math.max(1,...items.map(i=>i[1]));return items.map(i=>`<div class="bar-row"><span>${esc(i[0])}</span><div class="bar"><i class="${cls||''}" style="width:${Math.round(i[1]/mx*100)}%"></i></div><b>${i[1]}</b></div>`).join('')||'<p class="empty">Belum ada data.</p>'}
function statistikTab(){
 const bln={},div={};requests.forEach(r=>{const k=mKey(r.at);bln[k]=(bln[k]||0)+1;div[r.divisi]=(div[r.divisi]||0)+1});
 const bi=Object.keys(bln).sort().map(k=>[mLabel(k),bln[k]]);const di=Object.keys(div).sort((a,b)=>div[b]-div[a]).map(k=>[k,div[k]]);
 const c=requests.filter(r=>r.kind==='cuti').length,l=requests.filter(r=>r.kind==='lembur').length;
 return `<div class="cards"><div class="panel"><h3>Pengajuan per bulan</h3>${bars(bi)}</div><div class="panel"><h3>Pengajuan per divisi</h3>${bars(di,'b')}</div></div><div class="panel"><h3>Komposisi jenis pengajuan</h3>${bars([['Cuti / izin',c],['Lembur',l]])}</div>`}
function akunTab(){
 return `<div class="panel"><h3>Manajemen akun & sisa cuti</h3><p class="hint">Sisa cuti tahunan berkurang otomatis saat HRD menyetujui Cuti Tahunan. Akun nonaktif tidak bisa mengirim pengajuan.</p><div class="table-wrap"><table><thead><tr><th>NIK</th><th>Nama</th><th>Divisi</th><th>Sisa cuti (hari)</th><th>Status akun</th><th>Aksi</th></tr></thead><tbody>${employees.map(e=>`<tr><td>${e.nik}</td><td>${esc(e.nama)}</td><td>${esc(e.divisi)}</td><td><input type="number" min="0" max="60" id="sisa_${e.nik}" value="${e.sisa}" aria-label="Sisa cuti ${esc(e.nama)}" style="width:80px;border:2px solid #111;border-radius:7px;padding:7px"></td><td><span class="tag ${e.aktif?'green':'red'}">${e.aktif?'Aktif':'Nonaktif'}</span></td><td><div class="row-actions"><button class="btn teal sm" onclick="saveSisa('${e.nik}')">Simpan</button><button class="btn soft sm" onclick="toggleAkun('${e.nik}')">${e.aktif?'Nonaktifkan':'Aktifkan'}</button></div></td></tr>`).join('')}</tbody></table></div>${CLOUD?'':'<button class="btn danger sm" style="margin-top:16px" onclick="resetDemo()">Reset data demo</button>'}</div>`}
function saveSisa(nik){const e=employees.find(x=>x.nik===nik),v=parseInt(document.getElementById('sisa_'+nik).value,10);if(!e||isNaN(v)||v<0||v>60){toast('Isi sisa cuti 0–60 hari.');return}e.sisa=v;empWrite(e);logHr('Mengatur sisa cuti '+e.nama+' menjadi '+v+' hari');saveData();renderHrDashboard();toast('Sisa cuti '+e.nama+' diperbarui.')}
function toggleAkun(nik){const e=employees.find(x=>x.nik===nik);if(!e)return;e.aktif=!e.aktif;empWrite(e);logHr((e.aktif?'Mengaktifkan':'Menonaktifkan')+' akun '+e.nama);saveData();renderHrDashboard();toast('Akun '+e.nama+(e.aktif?' diaktifkan.':' dinonaktifkan.'))}
function resetDemo(){if(!confirm('Kembalikan semua pengajuan, log aktivitas, dan sisa cuti ke data contoh awal? Log akses HR tetap disimpan.'))return;
 employees.forEach(e=>{e.sisa=SISA0[e.nik];e.aktif=true});requests=seedRequests();activity=seedActivity();logHr('Mereset data demo');saveData();renderHrDashboard();toast('Data demo dikembalikan.')}
function aksesTab(){
 return `<div class="panel"><h3>Log akses HR (audit trail)</h3><p class="hint">Semua login, percobaan gagal, keputusan, dan unduhan HRD tercatat di sini agar pengawas pun tetap diawasi.${CLOUD?' Percobaan login gagal hanya dibatasi di perangkat dan tidak tercatat di server.':''}</p><div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Jam</th><th>ID HRD</th><th>Aktivitas</th></tr></thead><tbody>${hrLog.slice(0,150).map(a=>`<tr><td>${tglS(a.t)}</td><td>${jamS(a.t)}</td><td>${esc(a.who)}</td><td>${esc(a.aksi)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada catatan.</td></tr>'}</tbody></table></div></div>`}
function panduanHrTab(){
 const s=[['01','Tinjau antrean','Buka tab Antrean. Pengajuan terbaru ada di atas; tag ⚠ Bentrok muncul bila cuti satu divisi bertabrakan.'],['02','Cek detail','Klik Detail untuk melihat alasan, bukti, dan tanda tangan digital karyawan.'],['03','Putuskan','Pilih Setujui, Revisi, atau Tolak. Revisi dan Tolak wajib disertai catatan. Keputusan final terkunci.'],['04','Pantau aktivitas','Tab Log Aktivitas menampilkan siapa mengisi apa, tanggal, dan jam.'],['05','Unduh laporan','Di Rekap Bulanan, pilih bulan lalu unduh CSV (Excel) atau PDF berkode verifikasi.'],['06','Keluar dengan aman','Selalu tekan Keluar Ruang Kendali setelah selesai, terutama di komputer bersama.']];
 return `<div class="guide-grid">${s.map(x=>`<article class="guide-step"><div class="num">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div><div class="panel" style="margin-top:18px"><h3>Catatan sistem</h3><p class="hint" style="font-size:14px">${CLOUD?'Data tersinkron ke server (Firebase): pengajuan dari semua perangkat karyawan masuk ke dashboard ini secara langsung.':'Mode lokal: data hanya tersimpan di browser perangkat ini. Isi FIREBASE_CONFIG di kode agar pengajuan dari perangkat lain masuk ke dashboard ini.'}</p></div>`}

(function(){let n=null;try{n=localStorage.getItem('hrflow_me')}catch(e){}const x=employees.find(y=>y.nik===n);if(x){demoUser=x;loggedIn=true}})();
function empLogout(){loggedIn=false;demoUser=employees[0];try{localStorage.removeItem('hrflow_me')}catch(e){}go('login')}
initCloud();

if(!loggedIn)route='login';render();routeFromHash();
</script><style>

.bar{height:20px;border:2px solid #000;border-radius:6px;background:#fff;overflow:hidden}.bar i{display:block;height:100%;background:#2fb5a8}.bar i.b{background:#7cc4f5}

.modal{background:#fff;color:#12263f;border:3px solid #000;border-radius:12px;box-shadow:7px 7px 0 #000;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}.modal h3{margin:0 0 12px}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;font-size:14px;padding:8px 0;border-bottom:1px solid #d8e1ea}.kv b{color:#566578}

.shake{animation:hrShake .4s}@keyframes hrShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
